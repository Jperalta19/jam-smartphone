</style><header><div><strong>JAM<span style="color:var(--orange)"> Smartphone</span></strong><small>TECNOLOGÍA A TU ALCANCE</small></div><div><a href="tel:8494780006">☎ 849-478-0006</a> · <a href="https://instagram.com/jamsmartphone1">Instagram ↗</a></div></header><main class="wrap" id="main"></main><section id="printzone" hidden></section><footer>JAM Smartphone · Santo Domingo, República Dominicana<br>Versión demo · Catálogo ilustrativo, no se aceptan pedidos ni pagos.<br><a href="#admin">Administración demo</a> · <a href="#">Ver catálogo</a></footer><script>
const KEY='jam-smartphone-demo-v1';
const seed=[['Samsung Galaxy A15 128GB','Celulares',10900,8200,12,'📱'],['Samsung Galaxy A25 256GB','Celulares',16900,13200,7,'📱'],['Xiaomi Redmi 13 128GB','Celulares',9900,7400,10,'📱'],['Motorola Moto G54 256GB','Celulares',12500,9300,6,'📱'],['iPhone 12 128GB reacondicionado','Celulares',21900,17500,4,'📱'],['Smart TV 43 pulgadas FHD','Televisores',16900,12400,5,'📺'],['Smart TV 55 pulgadas 4K','Televisores',27900,21800,3,'📺'],['Aire inverter 12000 BTU','Climatización',28900,22400,4,'❄️'],['Lavadora semiautomática 18 lb','Electrodomésticos',13900,10100,3,'🧺'],['Microondas digital 0.7 pies³','Electrodomésticos',5900,4200,0,'🍽️'],['Cargador USB-C 25W','Accesorios',950,480,25,'🔌'],['Funda protectora universal','Accesorios',450,180,30,'🛡️'],['Audífonos Bluetooth TWS','Accesorios',1490,790,15,'🎧'],['Cable USB-C 1 metro','Accesorios',350,120,0,'🔗']];
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db||!Array.isArray(db.products)||!Array.isArray(db.sales))db={products:seed.map((p,i)=>({id:i+1,name:p[0],category:p[1],price:p[2],cost:p[3],stock:p[4],icon:p[5]})),sales:[],seq:0};let unlocked=false,cart=[],editId=null;const main=document.getElementById('main');const money=n=>'RD$ '+Number(n).toLocaleString('es-DO',{minimumFractionDigits:2,maximumFractionDigits:2});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Santo_Domingo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const dayOf=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Santo_Domingo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(d));const stamp=d=>new Date(d).toLocaleString('es-DO',{timeZone:'America/Santo_Domingo'});function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('No se pudo guardar. Revisa el almacenamiento del navegador.');return false}}function categories(){return [...new Set(db.products.map(p=>p.category))].sort()}function route(){document.getElementById('printzone').hidden=true;if(location.hash==='#admin')admin();else catalog()}
function catalog(){main.innerHTML='<section class="hero"><span class="eyebrow">SANTO DOMINGO · TIENDA FÍSICA</span><h1>Tu próximo upgrade<br>empieza aquí<span style="color:var(--orange)">.</span></h1><p>Celulares, entretenimiento y soluciones para tu hogar. Explora nuestra selección y conoce JAM Smartphone.</p><div class="notice">Versión demo: productos, precios y existencias inventados. No es una oferta comercial.</div></section><div class="tools"><input id="search" aria-label="Buscar productos" placeholder="Buscar tu próximo equipo…"><select id="filter" aria-label="Filtrar por categoría"><option value="">Todas las categorías</option>'+categories().map(c=>'<option>'+esc(c)+'</option>').join('')+'</select></div><p id="count" aria-live="polite"></p><section class="grid" id="products"></section>';document.getElementById('search').oninput=cards;document.getElementById('filter').onchange=cards;cards()}
function cards(){let q=document.getElementById('search').value.toLocaleLowerCase(),cat=document.getElementById('filter').value,ps=db.products.filter(p=>(!cat||p.category===cat)&&p.name.toLocaleLowerCase().includes(q));document.getElementById('count').textContent=ps.length+' productos · precios demo con ITBIS incluido';document.getElementById('products').innerHTML=ps.map(p=>'<article class="card"><div class="visual"><span aria-hidden="true">'+esc(p.icon||'📦')+'</span><small>'+esc(p.name)+'</small></div><div class="details"><span class="category">'+esc(p.category)+'</span><h3>'+esc(p.name)+'</h3><div class="price">'+money(p.price)+'</div><p><span class="badge '+(p.stock?'':'out')+'">'+(p.stock?'Disponible':'Agotado')+'</span> · Stock: '+p.stock+'</p></div></article>').join('')||'<p>No hay productos que coincidan.</p>'}
function admin(){if(!unlocked){main.innerHTML='<section class="panel login"><span class="eyebrow">VERSIÓN DEMO</span><h1 style="font-size:30px">Administración</h1><p>Acceso de demostración del lado cliente. No protege datos: el código y la clave son públicos. No ingreses información real.</p><form id="login"><label>Usuario<input id="user" autocomplete="username" required></label><label>Clave<input id="pass" type="password" autocomplete="current-password" required></label><button class="accent">Entrar</button><p class="error" id="loginerror" role="alert"></p></form></section>';document.getElementById('login').onsubmit=e=>{e.preventDefault();if(document.getElementById('user').value==='admin'&&document.getElementById('pass').value==='jam2026'){unlocked=true;admin()}else document.getElementById('loginerror').textContent='Usuario o clave incorrectos.'};return}let sales=db.sales.filter(s=>dayOf(s.date)===today());main.innerHTML='<div class="row"><h1 style="font-size:32px">Panel de tienda</h1><button id="logout">Cerrar sesión</button></div><p class="notice">Versión demo: los datos se guardan solo en este navegador. No hay servidor, pagos ni transmisión de ventas. No uses datos personales reales.</p><div class="stats"><div>Ventas de hoy<b>'+sales.length+'</b></div><div>Monto total del día<b>'+money(sales.reduce((a,s)=>a+s.total,0))+'</b></div></div><section class="panel"><h2>Inventario</h2><form id="productform"><div class="row"><label>Nombre<input id="pname" maxlength="100" required></label><label>Categoría<input id="pcategory" maxlength="50" required list="cats"><datalist id="cats">'+categories().map(c=>'<option value="'+esc(c)+'">').join('')+'</datalist></label></div><div class="row"><label>Precio RD$ (ITBIS incluido)<input id="pprice" type="number" min="0.01" step="0.01" required></label><label>Costo RD$<input id="pcost" type="number" min="0" step="0.01" required></label><label>Stock<input id="pstock" type="number" min="0" step="1" required></label><button id="psave" class="accent">Agregar producto</button><button type="button" id="cancel">Cancelar edición</button></div></form><div class="scroll"><table><thead><tr><th>Nombre / Categoría</th><th>Precio</th><th>Costo</th><th>Stock</th><th>Acciones</th></tr></thead><tbody>'+db.products.map(p=>'<tr><td>'+esc(p.name)+'<br><small>'+esc(p.category)+'</small></td><td>'+money(p.price)+'</td><td>'+money(p.cost)+'</td><td>'+p.stock+'</td><td><button data-edit="'+p.id+'">Editar</button><button data-delete="'+p.id+'">Eliminar</button></td></tr>').join('')+'</tbody></table></div></section><section class="panel"><h2>Registrar venta</h2><p>Simulación local · Los precios incluyen ITBIS 18%.</p><form id="additem" class="row"><label>Producto<select id="saleproduct">'+db.products.map(p=>'<option value="'+p.id+'" '+(!p.stock?'disabled':'')+'>'+esc(p.name)+' · '+money(p.price)+' · stock '+p.stock+'</option>').join('')+'</select></label><label>Cantidad<input id="qty" type="number" value="1" min="1" step="1" required></label><button>Agregar a venta</button></form><div id="cart"></div><form id="saleform"><div class="row"><label>Cliente (opcional)<input id="customer" maxlength="80" placeholder="Consumidor final · usar nombre ficticio"></label><label>Método de pago<select id="payment"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option></select></label></div><p id="saleerror" class="error" role="alert"></p><button class="accent" id="confirm">Confirmar venta demo</button></form></section><section class="panel"><h2>Historial de ventas</h2><div class="scroll"><table><thead><tr><th>Fecha / NCF demo</th><th>Ítems</th><th>Total</th><th>Recibo</th></tr></thead><tbody>'+db.sales.slice().reverse().map(s=>'<tr><td>'+stamp(s.date)+'<br>'+s.ncf+'</td><td>'+s.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')+'</td><td>'+money(s.total)+'</td><td><button data-receipt="'+s.id+'">Ver recibo</button></td></tr>').join('')+'</tbody></table></div>'+(!db.sales.length?'<p>Aún no hay ventas demo.</p>':'')+'</section>';editId=null;document.getElementById('logout').onclick=()=>{unlocked=false;cart=[];admin()};document.getElementById('cancel').onclick=()=>{editId=null;document.getElementById('productform').reset();document.getElementById('psave').textContent='Agregar producto'};document.getElementById('productform').onsubmit=saveProduct;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editProduct(Number(b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este producto del inventario demo? Las ventas históricas se conservan.')){let old=db.products;db.products=db.products.filter(p=>p.id!==Number(b.dataset.delete));if(save()){cart=cart.filter(i=>i.id!==Number(b.dataset.delete));admin()}else db.products=old}});document.getElementById('additem').onsubmit=addItem;document.getElementById('saleform').onsubmit=confirmSale;document.querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>receipt(db.sales.find(s=>s.id===Number(b.dataset.receipt)))) ;drawCart()}
function editProduct(id){let p=db.products.find(p=>p.id===id);editId=id;['name','category','price','cost','stock'].forEach(k=>document.getElementById('p'+k).value=p[k]);document.getElementById('psave').textContent='Guardar cambios';document.getElementById('productform').scrollIntoView({behavior:'smooth'})}
function saveProduct(e){e.preventDefault();let name=document.getElementById('pname').value.trim(),category=document.getElementById('pcategory').value.trim(),price=Number(document.getElementById('pprice').value),cost=Number(document.getElementById('pcost').value),stock=Number(document.getElementById('pstock').value);if(!name||!category||!Number.isFinite(price)||price<=0||!Number.isFinite(cost)||cost<0||!Number.isSafeInteger(stock)||stock<0){alert('Revisa los valores del producto.');return}let old=JSON.stringify(db),p=db.products.find(p=>p.id===editId);if(p)Object.assign(p,{name,category,price,cost,stock});else db.products.push({id:Date.now(),name,category,price,cost,stock,icon:'📦'});if(save())admin();else db=JSON.parse(old)}
function addItem(e){e.preventDefault();let p=db.products.find(p=>p.id===Number(document.getElementById('saleproduct').value)),q=Number(document.getElementById('qty').value),existing=p&&cart.find(i=>i.id===p.id);if(!p||!Number.isSafeInteger(q)||q<1||q+(existing?existing.qty:0)>p.stock){document.getElementById('saleerror').textContent='Cantidad inválida o stock insuficiente.';return}if(existing)existing.qty+=q;else cart.push({id:p.id,qty:q});document.getElementById('saleerror').textContent='';drawCart()}
function drawCart(){document.getElementById('cart').innerHTML=cart.map(i=>{let p=db.products.find(p=>p.id===i.id);return '<p>'+esc(p.name)+' × '+i.qty+' — '+money(p.price*i.qty)+' <button type="button" data-remove="'+i.id+'">Quitar</button></p>'}).join('')+'<p><strong>Total: '+money(cart.reduce((a,i)=>a+db.products.find(p=>p.id===i.id).price*i.qty,0))+'</strong></p>';document.getElementById('confirm').disabled=!cart.length;document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart=cart.filter(i=>i.id!==Number(b.dataset.remove));drawCart()})}
function confirmSale(e){e.preventDefault();if(!cart.length)return;let items=[];for(let i of cart){let p=db.products.find(p=>p.id===i.id);if(!p||i.qty>p.stock){document.getElementById('saleerror').textContent='El inventario cambió; revisa el stock.';return}items.push({...p,qty:i.qty})}let old=JSON.stringify(db),total=Math.round(items.reduce((a,i)=>a+i.price*i.qty,0)*100)/100;let s={id:Date.now(),date:new Date().toISOString(),items,total,customer:document.getElementById('customer').value.trim()||'Consumidor final',payment:document.getElementById('payment').value,ncf:'B01'+String(++db.seq).padStart(8,'0')};items.forEach(i=>db.products.find(p=>p.id===i.id).stock-=i.qty);db.sales.push(s);if(!save()){db=JSON.parse(old);return}cart=[];admin();receipt(s)}
function receipt(s){
// ===== CAMPOS FISCALES DEMO: sustituir SOLO tras validación profesional y DGII. =====
// B01 solicitado como ejemplo visual; NO equivale a factura de consumo válida.
const fiscal={rnc:'1-31-23456-7 (DEMO)',address:'Av. Duarte #123, Santo Domingo (dirección inventada)',ncf:s.ncf,rate:0.18,warning:'DEMO · SIN VALIDEZ FISCAL · NO REPORTAR A DGII'};
const subtotal=Math.round(s.total/(1+fiscal.rate)*100)/100,itbis=Math.round((s.total-subtotal)*100)/100;
// ===== FIN CONFIGURACIÓN FISCAL DEMO =====
let z=document.getElementById('printzone');z.hidden=false;z.innerHTML='<h2 class="screen" style="text-align:center">Recibo demo</h2><article id="receipt"><h2>JAM Smartphone</h2><p style="text-align:center">'+fiscal.warning+'</p><section class="fiscal-fields"><p>RNC: '+fiscal.rnc+'</p><p>'+fiscal.address+'</p><p>Tel. 849-478-0006</p><p>NCF DEMO: '+fiscal.ncf+'</p><p>Fecha: '+stamp(s.date)+'</p></section><hr><p>Cliente: '+esc(s.customer)+'</p><p>Pago: '+esc(s.payment)+'</p><table><thead><tr><th>Ítem / precio</th><th>Cant.</th><th>Importe</th></tr></thead><tbody>'+s.items.map(i=>'<tr><td>'+esc(i.name)+'<br>'+money(i.price)+'</td><td>'+i.qty+'</td><td>'+money(i.price*i.qty)+'</td></tr>').join('')+'</tbody></table><hr><p>Subtotal: '+money(subtotal)+'</p><p>ITBIS 18%: '+money(itbis)+'</p><p class="total">TOTAL: '+money(s.total)+'</p><p>Precios con ITBIS incluido.</p><hr><p style="text-align:center">¡Gracias por su compra!</p><p style="text-align:center">DOCUMENTO DE DEMOSTRACIÓN</p></article><div style="text-align:center"><button id="print">Imprimir recibo</button> <button id="closeReceipt">Cerrar recibo</button></div>';document.getElementById('print').onclick=()=>window.print();document.getElementById('closeReceipt').onclick=()=>z.hidden=true;z.scrollIntoView({behavior:'smooth'})}
window.addEventListener('hashchange',route);route();</script></html>
